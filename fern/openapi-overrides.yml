# SDK-only names; the wire format is unchanged.
components:
  securitySchemes:
    bearerAuth:
      # Keep the `token` argument and read SANKA_API_KEY when it is omitted,
      # the variable every Sanka doc and the Node SDK use.
      x-fern-bearer:
        name: token
        env: SANKA_API_KEY
  schemas:
    LineBlock:
      properties:
        # `from` is a Python keyword, so both endpoints get attribute names.
        from:
          x-fern-property-name: fromPoint
        to:
          x-fern-property-name: toPoint
